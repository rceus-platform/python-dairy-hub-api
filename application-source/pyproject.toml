[project]
name = "dairy-hub-api"
version = "0.1.0"
description = "Milk collection and billing system API"
authors = [{ name = "Developer" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.4,<0.129.0",
    "uvicorn>=0.40.0,<0.41.0",
    "sqlalchemy>=2.0.46,<3.0.0",
    "pydantic[email]>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "python-multipart>=0.0.22,<0.0.23",
    "python-dotenv>=1.2.1,<2.0.0",
    "requests>=2.32.5,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "black>=26.1.0,<27.0.0",
    "ruff>=0.15.0,<0.16.0",
    "mypy>=1.19.1,<2.0.0",
]

[project.scripts]
init-db = "scripts.init_sqlite:main"
seed-db = "scripts.seed_sqlite:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
